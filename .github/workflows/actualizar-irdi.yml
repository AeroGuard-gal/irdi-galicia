name: Actualizar IRDI Galicia

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-irdi-galicia
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Descargar o repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar capa municipal
        run: |
          if [ -f data/concellos_galicia.geojson ]; then
            echo "✓ Capa municipal presente"
          else
            echo "✗ ERRO: falta data/concellos_galicia.geojson"
            exit 1
          fi

      - name: Actualizar datos do IRDI
        run: python scripts/actualizar_irdi.py

      - name: Validar GeoJSON xerados
        run: python scripts/validar_saida.py

      - name: Facer commit dos GeoJSON actualizados
        run: |
          git config user.name "IRDI bot"
          git config user.email "actions@github.com"
          git add data/irdi_dia_*.geojson data/irdi_meta.json

          if git diff --staged --quiet; then
            echo "Sen cambios nos datos."
          else
            git commit -m "IRDI actualizado [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi

      - name: Enviar mapa a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/enviar_telegram.py
