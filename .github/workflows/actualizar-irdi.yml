name: Actualizar IRDI Galicia

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-irdi-galicia
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Descargar o repositorio
        run: |
          git clone https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} .
          git config user.name "IRDI bot"
          git config user.email "actions@github.com"

      - name: Comprobar Python
        run: |
          python3 --version
          python3 -m pip --version

      - name: Actualizar repositorios Ubuntu
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get install -y --no-install-recommends \
            libcairo2 \
            pkg-config

      - name: Instalar dependencias Python
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Verificar capa municipal
        run: |
          if [ -f data/concellos_galicia.geojson ]; then
            echo "✓ Capa municipal presente"
          else
            echo "✗ ERRO: falta data/concellos_galicia.geojson"
            exit 1
          fi

      - name: Actualizar datos do IRDI
        run: python3 scripts/actualizar_irdi.py

      - name: Validar GeoJSON xerados
        run: python3 scripts/validar_saida.py

      - name: Facer commit dos GeoJSON actualizados
        run: |
          git add data/irdi_dia_*.geojson data/irdi_meta.json

          if git diff --staged --quiet; then
            echo "Sen cambios nos datos."
          else
            git commit -m "IRDI actualizado [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi

      - name: Enviar mapa a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/enviar_telegram.py
